# Local stack. From this directory, with SECRET_KEY available in the shell
# or in the gitignored .env file:
#   docker compose up --build
#   docker compose logs -f
#   docker compose down
# The named volume sqlite_data keeps the database. docker compose down -v
# deletes that volume.

services:
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    image: blog-api
    ports:
      - "8000:8000"
    environment: &app-env
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the shell or in a gitignored .env file}
      DEBUG: ${DEBUG:-True}
      USE_HTTPS: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      SQLITE_PATH: /data/db.sqlite3
    volumes:
      - sqlite_data:/data
    depends_on:
      redis:
        condition: service_healthy
    command: >
      python manage.py migrate --noinput &&
      exec gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 1
      --access-logfile -
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/blog/api/status/")
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    image: blog-api
    environment: *app-env
    volumes:
      - sqlite_data:/data
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    command: celery -A config worker --loglevel=info --concurrency=1

volumes:
  sqlite_data:
